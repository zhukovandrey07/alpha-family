<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AlphaFamily Pro - Учим Буквы и Цифры</title>
    <meta name="description" content="Профессиональная образовательная игра для детей. Учим буквы, цифры, слова!">
    <meta name="theme-color" content="#6366F1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loading-content">
            <div class="loading-logo">
                <div class="logo-circle">
                    <span class="logo-text">ABC</span>
                </div>
            </div>
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
            <p class="loading-text">Загрузка...</p>
        </div>
    </div>

    <!-- Confetti Canvas -->
    <canvas id="confetti"></canvas>

    <!-- Particles Container -->
    <div id="particles"></div>

    <!-- Language Button -->
    <button class="lang-btn" onclick="app.toggleLang()" aria-label="Change language">
        <span class="lang-flag">🇷🇺</span>
    </button>

    <!-- Mute Button -->
    <button class="lang-btn" style="top: 90px;" onclick="app.toggleMute()" aria-label="Toggle Sound">
        <span class="lang-flag" id="mute-icon">🔊</span>
    </button>

    <!-- 1. MAIN MENU -->
    <div id="view-roles" class="screen center-content">
        <div class="menu-container">
            <div class="menu-header">
                <h1 class="game-title">
                    <span class="title-gradient">Alpha</span><span class="title-accent">Family</span>
                </h1>
                <p class="game-subtitle" id="lbl-subtitle">Учим буквы и цифры весело!</p>
            </div>

            <div class="menu-cards">
                <div class="role-card junior-card" onclick="app.setProfile('junior')">
                    <div class="card-glow junior-glow"></div>
                    <div class="role-icon-wrapper">
                        <span class="role-icon">👶</span>
                        <div class="icon-particles"></div>
                    </div>
                    <div class="role-content">
                        <h2 class="role-title" id="lbl-jun-title">Малыши</h2>
                        <p class="role-desc" id="lbl-jun-desc">до 6 лет</p>
                    </div>
                    <div class="card-shine"></div>
                </div>

                <div class="role-card senior-card" onclick="app.setProfile('senior')">
                    <div class="card-glow senior-glow"></div>
                    <div class="role-icon-wrapper">
                        <span class="role-icon">🚀</span>
                        <div class="icon-particles"></div>
                    </div>
                    <div class="role-content">
                        <h2 class="role-title" id="lbl-sen-title">Старшие</h2>
                        <p class="role-desc" id="lbl-sen-desc">до 10 лет</p>
                    </div>
                    <div class="card-shine"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. SENIOR SUB-MENU -->
    <div id="view-senior-menu" class="screen center-content hidden">
        <button class="btn-home" onclick="app.go('view-roles')" aria-label="Home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
        </button>

        <div class="submenu-container">
            <h2 class="section-title" id="lbl-select-subj">Выбери предмет:</h2>
            <div class="subject-grid">
                <button class="subject-btn letters-btn" onclick="app.startSubject('letters')">
                    <div class="btn-icon">🅰️</div>
                    <span id="lbl-letters">Буквы</span>
                    <div class="btn-ripple"></div>
                </button>
                <button class="subject-btn math-btn" onclick="app.goToMathMenu()">
                    <div class="btn-icon">🔢</div>
                    <span id="lbl-math">Цифры</span>
                    <div class="btn-ripple"></div>
                </button>
                <button class="subject-btn syllables-btn" onclick="app.go('view-syllable-menu')">
                    <div class="btn-icon">📖</div>
                    <span id="lbl-syllables">Слоги</span>
                    <div class="btn-ripple"></div>
                </button>
            </div>
        </div>
    </div>

    <!-- 3. MAP VIEW -->
    <div id="view-map" class="screen hidden">
        <button class="btn-home" onclick="app.goBackFromMap()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
        </button>

        <div class="map-container-wrapper">
            <div class="map-header">
                <h2 class="section-title animated-title">
                    <span class="title-icon">🗺️</span>
                    <span id="lbl-map">Карта уровней</span>
                </h2>
            </div>

            <div class="map-actions">
                <button class="action-btn dict-btn" onclick="app.showDictionary()">
                    <span class="btn-icon">📖</span>
                    <span id="lbl-dict">Словарь</span>
                </button>
                <button class="action-btn find-btn" id="btn-philwords" onclick="app.showPhilwordMenu()">
                    <span class="btn-icon">🔎</span>
                    <span id="lbl-find">Найди слова</span>
                </button>
            </div>

            <div class="level-path" id="map-container"></div>
        </div>
    </div>

    <!-- 4. SYLLABLE MENU -->
    <div id="view-syllable-menu" class="screen center-content hidden">
        <button class="btn-home" onclick="app.go('view-senior-menu')" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
        </button>

        <div class="submenu-container">
            <h2 class="section-title" id="lbl-syllable-select">Выбери режим:</h2>
            <div class="subject-grid">
                <button class="subject-btn letters-btn" onclick="app.startSyllableBasic()">
                    <div class="btn-icon">📖</div>
                    <span id="lbl-syl-basic">По слогам</span>
                    <div class="btn-ripple"></div>
                </button>
                <button class="subject-btn math-btn" onclick="app.startSyllableAdvanced()">
                    <div class="btn-icon">🧩</div>
                    <span id="lbl-syl-advanced">Собери слово</span>
                    <div class="btn-ripple"></div>
                </button>
            </div>
        </div>
    </div>

    <!-- 5. SYLLABLE BASIC MODE -->
    <div id="view-syllable-basic" class="screen center-content hidden">
        <button class="btn-home" onclick="app.go('view-syllable-menu')" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
        </button>

        <div class="syllable-exercise-container">
            <div class="word-display-area">
                <div class="word-emoji" id="syllable-emoji">🐱</div>
                <h2 class="word-title" id="syllable-word">кош-ка</h2>
                <p class="syllable-hint" id="syllable-hint">Нажми на слог</p>
            </div>

            <div class="syllable-tiles-container" id="syllable-tiles"></div>

            <div class="syllable-controls">
                <button class="action-btn" id="btn-next-word" onclick="app.nextSyllableWord()">
                    <span class="btn-icon">➡️</span>
                    <span id="lbl-next-word">Следующее слово</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 6. SYLLABLE ADVANCED MODE -->
    <div id="view-syllable-advanced" class="screen center-content hidden">
        <button class="btn-home" onclick="app.go('view-syllable-menu')" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
        </button>

        <div class="syllable-exercise-container">
            <div class="word-display-area">
                <div class="word-emoji" id="advanced-emoji">🍌</div>
                <div class="assembly-zone" id="assembly-zone"></div>
            </div>

            <div class="scrambled-tiles-container" id="scrambled-tiles"></div>

            <div class="syllable-controls">
                <button class="action-btn reset-btn" id="btn-reset" onclick="SyllableGame.resetAssembly()">
                    <span class="btn-icon">🔄</span>
                    <span id="lbl-reset">Сброс</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 7. MATH GAME -->
    <div id="view-math-game" class="screen center-content hidden">
        <button class="btn-home" onclick="app.go('view-roles')" aria-label="Home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
        </button>

        <div class="math-game-container">
            <div class="math-header">
                <div class="score-board">
                    <span>⭐ <span id="math-score">0</span></span>
                    <span>Lvl <span id="math-level">1</span></span>
                </div>
            </div>

            <div class="math-problem-area">
                <div id="math-visual-items" class="math-visuals"></div>
                <div id="math-equation" class="math-equation"></div>
            </div>

            <div id="math-options" class="math-options-grid"></div>
            <div id="table-display" class="table-display-grid hidden"></div>
        </div>
    </div>

    <!-- 8. JUNIOR GAME -->
    <div id="view-junior-game" class="screen center-content hidden">
        <button class="btn-home" onclick="app.go('view-map')" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
        </button>
        <div id="junior-game-area" class="junior-game-area" style="width: 100%; max-width: 600px;"></div>
    </div>

    <!-- 9. SENIOR SPELLING GAME -->
    <div id="view-game-senior" class="screen center-content hidden">
        <button class="btn-home" onclick="app.go('view-senior-menu')" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
        </button>
        <div class="game-container" style="text-align: center; width: 100%; max-width: 600px;">
            <div class="senior-header"
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <div class="sen-image" id="sen-img" style="font-size: 4rem;"></div>
                <div class="sen-controls">
                    <label class="difficulty-toggle">
                        <input type="checkbox" id="chk-hardmode" onchange="SeniorGame.toggleHardMode()">
                        <span id="lbl-hard">Hard</span>
                    </label>
                </div>
            </div>
            <h2 id="lbl-task-write" style="margin-bottom: 10px;">Write word:</h2>
            <div class="slot-container" id="sen-slots"></div>
            <div class="timer-wrap">
                <div class="timer-bar" id="timer-bar"></div>
            </div>
            <div class="pool-container" id="sen-pool"></div>
            <button class="action-btn" onclick="SeniorGame.speakCurrent()"
                style="margin-top: 20px; margin-left: auto; margin-right: auto;">🔊</button>
        </div>
    </div>

    <!-- 10. PHILWORDS MENU -->
    <div id="view-phil-menu" class="screen center-content hidden">
        <button class="btn-home" onclick="app.go('view-map')" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
        </button>
        <div class="submenu-container">
            <h2 class="section-title">Philwords</h2>
            <div class="level-path" id="phil-menu-container"></div>
        </div>
    </div>

    <!-- 11. PHILWORDS GAME -->
    <div id="view-game-phil" class="screen center-content hidden">
        <button class="btn-home" onclick="app.go('view-phil-menu')" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
        </button>
        <div class="phil-container" style="width: 100%; max-width: 500px;">
            <div class="phil-header" style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
                <div class="phil-letter-big" id="phil-letter-big"
                    style="font-size: 3rem; font-weight: bold; color: var(--primary);">A</div>
                <div class="phil-hint" id="lbl-phil-hint" style="font-size: 1.2rem;">Find words:</div>
            </div>
            <div class="phil-targets" id="phil-targets"></div>
            <div class="phil-grid" id="phil-grid"></div>
        </div>
    </div>

    <!-- 12. DICTIONARY -->
    <div id="view-dict" class="screen hidden">
        <button class="btn-home" onclick="app.go('view-map')" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
        </button>
        <div class="map-container-wrapper">
            <h2 class="section-title" style="text-align: center; margin-bottom: 20px;">Dictionary</h2>
            <div class="dict-list" id="dict-container" style="margin: 0 auto;"></div>
        </div>
    </div>

    <!-- 13. SPACE MATH -->
    <div id="view-math-space" class="screen hidden">
        <button class="btn-home" onclick="MathGame.stopSpaceMode(); app.go('view-senior-menu')" aria-label="Back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
        </button>
        <div class="space-game" style="width: 100%; height: 100%; display: flex; flex-direction: column;">
            <div class="space-canvas" id="space-canvas"></div>
            <div class="space-controls">
                <div class="space-input" id="space-input"></div>
                <div class="numpad">
                    <div class="numpad-row">
                        <button class="num-btn" onclick="MathGame.handleSpaceInput('1')">1</button>
                        <button class="num-btn" onclick="MathGame.handleSpaceInput('2')">2</button>
                        <button class="num-btn" onclick="MathGame.handleSpaceInput('3')">3</button>
                    </div>
                    <div class="numpad-row">
                        <button class="num-btn" onclick="MathGame.handleSpaceInput('4')">4</button>
                        <button class="num-btn" onclick="MathGame.handleSpaceInput('5')">5</button>
                        <button class="num-btn" onclick="MathGame.handleSpaceInput('6')">6</button>
                    </div>
                    <div class="numpad-row">
                        <button class="num-btn" onclick="MathGame.handleSpaceInput('7')">7</button>
                        <button class="num-btn" onclick="MathGame.handleSpaceInput('8')">8</button>
                        <button class="num-btn" onclick="MathGame.handleSpaceInput('9')">9</button>
                    </div>
                    <div class="numpad-row">
                        <button class="num-btn" onclick="MathGame.handleSpaceInput('del')">⌫</button>
                        <button class="num-btn" onclick="MathGame.handleSpaceInput('0')">0</button>
                        <button class="num-btn green" onclick="MathGame.handleSpaceInput('ok')">🚀</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="data.js"></script>
    <script src="core.js"></script>
    <script src="math.js"></script>
    <script src="syllables.js"></script>
    <script src="junior.js"></script>
    <script src="senior.js"></script>
    <script src="philwords.js"></script>
    <script src="app.js"></script>
</body>

</html>
